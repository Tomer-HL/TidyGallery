# XcodeGen spec — generates TidyGallery.xcodeproj from source, so no Mac is
# needed to "set up" the project by hand. On a Mac or in CI:
#   brew install xcodegen && xcodegen generate
# then open TidyGallery.xcodeproj (or let CI run the tests headlessly).

name: TidyGallery

options:
  bundleIdPrefix: com.tidygallery
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Both languages must be declared, or iOS won't offer the app in Hebrew even
  # with he.lproj present in the bundle.
  developmentLanguage: en

# Note: there is deliberately no `knownRegions` key here. It isn't part of
# XcodeGen's project spec (an earlier version of this file had one, where it was
# silently ignored) — XcodeGen derives the project's known regions from the
# .lproj directories it finds while building variant groups. The languages the
# app ships are therefore decided by what exists under Resources/, and the
# `ios-tests` workflow asserts both of them actually land in the built bundle.

# Applied to every target. Swift 6 language mode turns on complete strict
# concurrency checking — the whole codebase is written to pass it.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO   # tests run unsigned on the simulator (free, no account)

targets:

  TidyGallery:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Persistence
      - Services
      - Utilities
      - ViewModels
      - Views
      # en.lproj / he.lproj, generated by Scripts/build_localizations.py and
      # committed, so CI needs no extra step to build — only to verify.
      #
      # A plain group, NOT `type: folder`: a folder reference would copy the
      # directory verbatim and the .lproj folders would land at
      # `Resources/en.lproj` inside the bundle, where iOS does not look for them.
      # As a group, XcodeGen recognises the .lproj directories and builds proper
      # variant groups, which land at the bundle root where they belong.
      #
      # The same group also carries Assets.xcassets (the app icon) and
      # PrivacyInfo.xcprivacy. Both rely on the same behaviour: a group's files
      # land at the bundle ROOT, which is where iOS looks for the compiled asset
      # catalog and where App Store validation looks for the privacy manifest.
      # `type: folder` here would nest them under `Resources/` and both would be
      # silently ignored.
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidygallery.app
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Photo-library permission string, injected into the generated Info.plist.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "TidyGallery analyses your photos entirely on-device to suggest duplicates you can clean up. Nothing is ever deleted without your confirmation."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

        # App icon. Named explicitly rather than relying on the default, because
        # the failure mode is silent: without an icon the app still builds and
        # runs, and only App Store Connect rejects it — after the upload. That
        # blocks TestFlight, not just release.
        #
        # A single 1024×1024 in the appiconset is deliberate: since Xcode 14 the
        # toolchain downsamples every required size itself, so the alternative is
        # a dozen near-identical PNGs that can drift out of sync with each other.
        # Regenerate with `python3 Scripts/make_app_icon.py`.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # Export compliance. Declared here rather than answered by hand in App
        # Store Connect, because the hand-answered version is asked once per
        # build and blocks the build from reaching testers until you notice.
        #
        # `false` is the accurate answer, not the convenient one: the app makes
        # no network calls at all (no URLSession anywhere in the target), and
        # uses no cryptography beyond what iOS itself applies to files at rest,
        # which is exactly the exemption this key describes.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

        # Signing is left unset on purpose. CI supplies it per-workflow:
        # `build-ipa` builds unsigned for sideloading, `testflight` signs with
        # the App Store Connect API key. Hard-coding a team here would break the
        # unsigned path and put an account id in a public repo.

  TidyGalleryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TidyGalleryTests
    dependencies:
      - target: TidyGallery
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TidyGallery.app/TidyGallery"

  # macOS command-line tool for threshold calibration. Runs the real Vision
  # feature-print model (which the iOS Simulator can't), reading images straight
  # from the repo. Shares the app's analysis sources; excludes UIKit/Photos code.
  CalibrationTool:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - CalibrationTool
      - Models
      - Utilities
      - path: Services/ImageAnalyzer.swift
      - path: Services/StackBuilder.swift
      - path: Services/ShotScorer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidygallery.calibration
        MACOSX_DEPLOYMENT_TARGET: "15.0"

# An explicit shared scheme so `xcodebuild -scheme TidyGallery test` works in CI.
schemes:
  TidyGallery:
    build:
      targets:
        TidyGallery: all
    test:
      targets:
        - TidyGalleryTests
      gatherCoverageData: true

  CalibrationTool:
    build:
      targets:
        CalibrationTool: all
    run:
      config: Debug

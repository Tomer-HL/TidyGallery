# XcodeGen spec — generates TidyGallery.xcodeproj from source, so no Mac is
# needed to "set up" the project by hand. On a Mac or in CI:
#   brew install xcodegen && xcodegen generate
# then open TidyGallery.xcodeproj (or let CI run the tests headlessly).

name: TidyGallery

options:
  bundleIdPrefix: com.tidygallery
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Both languages must be declared, or iOS won't offer the app in Hebrew even
  # with he.lproj present in the bundle.
  developmentLanguage: en

# Note: there is deliberately no `knownRegions` key here. It isn't part of
# XcodeGen's project spec (an earlier version of this file had one, where it was
# silently ignored) — XcodeGen derives the project's known regions from the
# .lproj directories it finds while building variant groups. The languages the
# app ships are therefore decided by what exists under Resources/, and the
# `ios-tests` workflow asserts both of them actually land in the built bundle.

# Applied to every target. Swift 6 language mode turns on complete strict
# concurrency checking — the whole codebase is written to pass it.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO   # tests run unsigned on the simulator (free, no account)

targets:

  TidyGallery:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Persistence
      - Services
      - Utilities
      - ViewModels
      - Views
      # en.lproj / he.lproj, generated by Scripts/build_localizations.py and
      # committed, so CI needs no extra step to build — only to verify.
      #
      # A plain group, NOT `type: folder`: a folder reference would copy the
      # directory verbatim and the .lproj folders would land at
      # `Resources/en.lproj` inside the bundle, where iOS does not look for them.
      # As a group, XcodeGen recognises the .lproj directories and builds proper
      # variant groups, which land at the bundle root where they belong.
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidygallery.app
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Photo-library permission string, injected into the generated Info.plist.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "TidyGallery analyses your photos entirely on-device to suggest duplicates you can clean up. Nothing is ever deleted without your confirmation."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  TidyGalleryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TidyGalleryTests
    dependencies:
      - target: TidyGallery
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TidyGallery.app/TidyGallery"

  # macOS command-line tool for threshold calibration. Runs the real Vision
  # feature-print model (which the iOS Simulator can't), reading images straight
  # from the repo. Shares the app's analysis sources; excludes UIKit/Photos code.
  CalibrationTool:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - CalibrationTool
      - Models
      - Utilities
      - path: Services/ImageAnalyzer.swift
      - path: Services/StackBuilder.swift
      - path: Services/ShotScorer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidygallery.calibration
        MACOSX_DEPLOYMENT_TARGET: "15.0"

# An explicit shared scheme so `xcodebuild -scheme TidyGallery test` works in CI.
schemes:
  TidyGallery:
    build:
      targets:
        TidyGallery: all
    test:
      targets:
        - TidyGalleryTests
      gatherCoverageData: true

  CalibrationTool:
    build:
      targets:
        CalibrationTool: all
    run:
      config: Debug

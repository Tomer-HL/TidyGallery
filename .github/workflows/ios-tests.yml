name: iOS Tests

# Runs the pure-logic test suite on a free GitHub-hosted macOS runner.
# Public repos get unlimited macOS minutes; no Apple Developer account is
# required because simulator unit tests run unsigned.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # lets you trigger a run manually from the Actions tab

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Runs before the build on purpose: a missing translation is a content
      # bug, not a compile error, so nothing downstream would ever catch it.
      # Failing here means the message names the exact string.
      - name: Check localization coverage
        run: python3 Scripts/build_localizations.py --check

      # The committed .lproj files must match what the JSON sources produce.
      # Regenerating and diffing is what stops someone hand-editing the
      # generated output and having it silently overwritten later.
      - name: Verify generated localization files are up to date
        run: |
          python3 Scripts/build_localizations.py
          git diff --exit-code -- Resources/ || {
            echo "::error::Resources/*.lproj is out of date."
            echo "Run: python3 Scripts/build_localizations.py — then commit the result."
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators (diagnostic)
        run: xcrun simctl list devices available | grep -i iphone || true

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project TidyGallery.xcodeproj \
            -scheme TidyGallery \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Everything above proves the translations are complete and consistent.
      # None of it proves they reach the app: XcodeGen has to turn the .lproj
      # directories into variant groups and Xcode has to copy them into the
      # bundle, and if either doesn't happen the app runs in English with no
      # error anywhere. iOS also only offers a per-app Language setting when it
      # can see more than one .lproj inside the built product — so if this step
      # fails, that setting won't appear on the device either.
      - name: Verify localizations reached the built app bundle
        if: always()
        run: |
          APP="$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'TidyGallery.app' -path '*Debug-iphonesimulator*' | head -1)"
          if [ -z "$APP" ]; then echo "::error::No built TidyGallery.app found"; exit 1; fi
          echo "Inspecting $APP"
          ls -la "$APP" | grep -i lproj || true
          MISSING=0
          for LANG in en he; do
            if [ ! -f "$APP/$LANG.lproj/Localizable.strings" ]; then
              echo "::error::$LANG.lproj/Localizable.strings is missing from the app bundle"
              MISSING=1
            fi
            if [ ! -f "$APP/$LANG.lproj/Localizable.stringsdict" ]; then
              echo "::error::$LANG.lproj/Localizable.stringsdict is missing from the app bundle"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "The app would silently run in English only. Check the Resources/ entry in project.yml."
            exit 1
          fi
          echo "Both localizations are present in the bundle."

      - name: Upload test results
        if: always()   # keep the bundle even when tests fail, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

      # Calibration runs NATIVELY on macOS, where VNGenerateImageFeaturePrint
      # actually executes (the iOS Simulator returns constant embeddings).
      - name: Build calibration tool (native macOS)
        if: always()
        run: |
          set -o pipefail
          xcodebuild build \
            -project TidyGallery.xcodeproj \
            -scheme CalibrationTool \
            -destination 'platform=macOS' \
            -derivedDataPath calib-dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Run calibration report
        if: always()
        run: |
          BIN="$(find calib-dd/Build/Products -type f -name CalibrationTool | head -1)"
          echo "Running: $BIN Tests/CalibrationImages"
          "$BIN" Tests/CalibrationImages
